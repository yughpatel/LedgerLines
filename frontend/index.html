<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#10131A" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F7F7F4" media="(prefers-color-scheme: light)" />
    <meta name="description" content="Track what comes in and what goes out, month by month." />
    <title>LedgerLines</title>
    <script>
      // Apply a saved theme before the first paint, so the page never flashes the wrong one.
      // No saved choice means the OS setting decides (see index.css)
      try {
        var t = localStorage.getItem("ll_theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (e) { /* storage blocked: follow the OS */ }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
